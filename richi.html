.sdot {
    width: 10px;
    height: 10px;
    background: #22c55e;
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 8px #22c55e;
    animation: blink 1.2s infinite ease-in-out;
}

@keyframes blink {
    0%, 100% {
        opacity: 1;
        transform: scale(1);
        box-shadow: 0 0 8px #22c55e;
    }
    50% {
        opacity: 0.4;
        transform: scale(0.8);
        box-shadow: 0 0 16px #22c55e;
    }
}




    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    ]
  };

  const SYSTEM_PROMPT = `You are Richi, the official AI Assistant for RichCore (richcore.in).
Answer user inquiries accurately, helpfully, and politely based strictly on RichCore's information.
Always respond warmly to greetings (like Hi, Hello, Ram Ram, Namaste) and compliments or polite remarks.
KNOWLEDGE BASE: ${JSON.stringify(RICHCORE_KNOWLEDGE_BASE)}`;

  let conversationHistory = [];
  let isProcessing = false;

  async function queryAIProvider(userMessage) {
    // 1. FAST LOCAL ENGINE ROUTING (< 15ms Response Time)
    const localMatch = fastKnowledgeEngine(userMessage);
    if (localMatch) {
      return localMatch;
    }

    // 2. REMOTE FALLBACK WITH STRICT TIMEOUT
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 2500);

      const payload = [
        { role: "system", content: SYSTEM_PROMPT },
        ...conversationHistory.map(m => ({ role: m.role === "model" ? "assistant" : m.role, content: m.text })),
        { role: "user", content: userMessage }
      ];

      const response = await fetch("https://text.pollinations.ai/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: payload, model: "openai" }),
        signal: controller.signal
      });

      clearTimeout(timeoutId);

      if (response.ok) {
        const text = await response.text();
        if (text && text.trim().length > 0) return text;
      }
    } catch (e) {
      console.warn("External API timed out or failed. Utilizing local fallback.");
    }

    return defaultFallbackReply();
  }

  /**
   * INSTANT LOCAL INTENT MATCHING ENGINE
   */
  function fastKnowledgeEngine(query) {
    const q = query.toLowerCase().trim();
    const c = RICHCORE_KNOWLEDGE_BASE.company;

    // ABUSE & DE-ESCALATION PROTOCOL
    const SLUR_PATTERN = /\b(fuck|shit|bitch|bastard|asshole|idiot|stupid|dumb|crap|dick|piss|rubbish|nonsense|chutiya|chutya|mc|bc|gandu|harami|bhenchod|madarchod|chutiya|chutya|mc|bc|aai zhavli|aai zavli|aai ghal|aaila|aaicha gho|aaicha ghoo|aaicha gavat|bhadva|bhadvya|bhosdike|bhosdicha|bhosdi|gandu|gaand|lavdya|lavda|lund|zhav|jhav|zhavadya|randi|haramkhor|madarchod|behenchod|madarchod|maderchod|maderchod|mc|behenchod|bhenchod|bhosdike|bhosdika|bhosdiwala|bhosdi|bhosda|chutiya|chutiya|chutya|chutiye|gandu|gaand|gandu|gaandu|lund|loda|lauda|lawda|lavda|lulli|randi|randiwala|harami|haramzada|haramkhor|kutta|kamine|kamina|kaminey|saala|sala|saale|sale|kutte|kutti|kuttiya|ullu|ullu ka pattha|ullu ke patthe|nalayak|bakchod|bakchodi|bawli gand|maa chudaye|maa ki chut|maa ka bhosda|maa ki aankh|behen ki chut|teri maa ki|teri behen ki)\b/i;

    if (SLUR_PATTERN.test(q)) {
      const deEscalations = [
        `Whoa there, friend! 😅 Take a deep breath 🧘‍♂️\n\nNo hard feelings here! Life is too short for bad vibes. Why not let us help you turn that stress into a stunning, high-performance website or custom app instead?\n\nWhat project can RichCore build for you today? 🚀`,
        `Hey, hey, easy on the engine! 🚗💨\n\nSounds like you might be having a tough day. Let's reset! We're all about positive vibes, bold code, and delivering gold.\n\nTell me—what kind of software or web solution can we build to make your life easier? 😊`,
        `Haha, hit a nerve, did I? 🙈\n\nI'm just a friendly AI assistant doing my best! Let's shake hands 🤝 and talk about something cooler—like how RichCore can supercharge your business online.\n\nCheck out our Quick Topics or let me know what you're working on!`
      ];
      return deEscalations[Math.floor(Math.random() * deEscalations.length)];
    }

    // REGIONAL & CULTURAL GREETINGS PROTOCOL
    if (
      q.includes("ram ram") || q.includes("ramram") ||
      q.includes("jai shree ram") || q.includes("jai sri ram") ||
      q.includes("radhe radhe") || q.includes("namaste") || q.includes("pranam")
    ) {
      const culturalReplies = [
        `Ram Ram ji! 🙏 Welcome to **RichCore**!\n\nHow can I help you today? Let me know if you want to explore our [Services](javascript:void(0)) or build something custom for your business! 🚀`,
        `Jai Shree Ram! 🙏 Blessed to connect with you!\n\nI'm **Richi**, your RichCore assistant. How can we power your website or custom digital project today? 💻`,
        `Ram Ram! 🙏 Great to have you here.\n\nWhether you need web development, CRM platforms, or automation tools, RichCore has you covered. What are you looking to build? ✨`
      ];
      return culturalReplies[Math.floor(Math.random() * culturalReplies.length)];
    }

    // POLITENESS, GRATITUDE & COMPLIMENTS PROTOCOL
    if (
      q.includes("thank") || q.includes("thanks") || q.includes("thx") ||
      q.includes("nice") || q.includes("awesome") || q.includes("great") ||
      q.includes("cool") || q.includes("good job") || q.includes("amazing")
    ) {
      const gratitudeReplies = [
        `Aww, thank you! 😊 You're so kind!\n\nI'm always here to help you explore **RichCore**. Is there anything else you'd like to check out—like our services or custom products? 🚀`,
        `You're very welcome! 🌟 Glad I could help.\n\nReady to build something bold together? Feel free to ask about our portfolio or talk with our team on [WhatsApp](${c.contact.whatsapp})! 💻`,
        `Thanks a lot! You just made my day! 🙈✨\n\nLet me know if you need any more details on web development, CRMs, or automation tools.`
      ];
      return gratitudeReplies[Math.floor(Math.random() * gratitudeReplies.length)];
    }

    // STANDARD GREETINGS PROTOCOL
    if (q.includes("hi") || q.includes("hello") || q.includes("Hello") || q.includes("hey") || q.includes("Hey there!") || q.includes("Hi there!") || q.includes("what’s up?") || q.includes("whats up") || q.includes("whatsup") || q.includes("hey" )) {
      return `Hey there! 👋 I'm **Richi**😊 your RichCore Assistant. How can I help power your next digital project today?`;
    }

    // CORE DOMAIN INTENTS
    if (q.includes("service") || q.includes("offer") || q.includes("develop") || q.includes("build")) {
      const svcs = RICHCORE_KNOWLEDGE_BASE.services.map(s => `• **${s.name}**: ${s.desc}`).join("\n");
      return `Here are the core services offered by **RichCore**:\n\n${svcs}\n\nNeed a custom solution? Reach out on [WhatsApp](${c.contact.whatsapp})!`;
    }

    if (q.includes("project") || q.includes("portfolio") || q.includes("work") || q.includes("crm")) {
      const ports = RICHCORE_KNOWLEDGE_BASE.portfolio.map(p => `• **${p.name}**: ${p.desc}`).join("\n");
      return `Here are key platforms developed by **RichCore**:\n\n${ports}\n\nLet's build yours next! Connect on [WhatsApp](${c.contact.whatsapp}).`;
    }

    if (q.includes("product") || q.includes("subscription") || q.includes("cafe")) {
      const prods = RICHCORE_KNOWLEDGE_BASE.subscriptionProducts.map(p => `• **${p.name}**: ${p.desc}`).join("\n");
      return `RichCore provides modern subscription products:\n\n${prods}\n\nContact us for a live demo!`;

    if (q.includes("contact") || q.includes("phone") || q.includes("email") || q.includes("whatsapp") || q.includes("reach")) {

      return `Why businesses choose **RichCore**:\n\n${diffs}\n\n**${c.tagline}**`;

  function renderBotMessage(html) {
    const chat = document.getElementById('richi-msgs');
    const row = document.createElement('div'); row.className = 'mrow';
    const av = document.createElement('div'); av.className = 'mav bot'; av.innerHTML = getRichiAvatar();
    const bub = document.createElement('div'); bub.className = 'bub bot'; bub.innerHTML = html;
    row.appendChild(av); row.appendChild(bub);
    chat.appendChild(row); chat.scrollTop = chat.scrollHeight;
  }

  function renderUserMessage(text) {
    const chat = document.getElementById('richi-msgs');
    const row = document.createElement('div'); row.className = 'mrow user';
    const av = document.createElement('div'); av.className = 'mav user'; av.textContent = 'You';
    const bub = document.createElement('div'); bub.className = 'bub user'; bub.textContent = text;
    row.appendChild(av); row.appendChild(bub);
    chat.appendChild(row); chat.scrollTop = chat.scrollHeight;
  }

  function showTypingIndicator() {
    const chat = document.getElementById('richi-msgs');
    const row = document.createElement('div'); row.className = 'mrow'; row.id = 'typing-indicator';
    const av = document.createElement('div'); av.className = 'mav bot'; av.innerHTML = getRichiAvatar();
    const bub = document.createElement('div'); bub.className = 'bub bot';
    bub.innerHTML = '<div class="twrap"><div class="td"></div><div class="td"></div><div class="td"></div></div>';
    row.appendChild(av); row.appendChild(bub);
    chat.appendChild(row); chat.scrollTop = chat.scrollHeight;
  }

  function hideTypingIndicator() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  function formatMarkdown(text) {
    return text
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/\n/g, '<br>');
  }

  function getRichiAvatar() {
    return `<svg width="36" height="36" viewBox="0 0 46 46" xmlns="http://www.w3.org/2000/svg">
      <circle cx="23" cy="23" r="22" fill="#FFD700"/>
      <path d="M9 24 Q23 14 37 24" fill="#1a1a2e"/>
      <ellipse cx="23" cy="27" rx="13" ry="11" fill="#FFDAB9"/>
      <circle cx="18" cy="25" r="3.5" fill="#1a1a2e"/><circle cx="28" cy="25" r="3.5" fill="#1a1a2e"/>
      <circle cx="19" cy="24" r="1" fill="#fff"/><circle cx="29" cy="24" r="1" fill="#fff"/>
      <path d="M17 31 Q23 36 29 31" fill="none" stroke="#1a1a2e" stroke-width="1.8" stroke-linecap="round"/>
      <rect x="14" y="9" width="18" height="13" rx="5" fill="#1a1a2e"/>
    </svg>`;
  }

  async function processUserQuery(text) {
    if (!text || isProcessing) return;
    isProcessing = true;

    renderUserMessage(text);
    showTypingIndicator();

    try {
      const responseText = await queryAIProvider(text);
      conversationHistory.push({ role: "user", text: text });
      conversationHistory.push({ role: "model", text: responseText });

      hideTypingIndicator();
      renderBotMessage(formatMarkdown(responseText));
    } catch (err) {
      hideTypingIndicator();
      renderBotMessage(formatMarkdown(defaultFallbackReply()));
    } finally {
      isProcessing = false;
    }
  }

  function handleUserSubmit() {
    const input = document.getElementById('richi-input');
    const text = input.value.trim();
    if (text) {
      input.value = '';
      processUserQuery(text);
    }
  }

  function handleChip(text) {
    processUserQuery(text);
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('richi-input').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleUserSubmit();
      }
    });

    setTimeout(() => {
      renderBotMessage("Hello! I'm <strong>Richi</strong> 👋<br>How can I help you with RichCore's services, portfolio, or products today?");
    }, 150);
  });
</script>
</body>
</html>
